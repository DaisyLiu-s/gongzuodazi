<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作搭子">
<meta name="theme-color" content="#e8763a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>工作搭子</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#2b2a28;--mut:#8a857d;--line:#e8e3dc;--acc:#e8763a;--acc2:#fff1e8;--warn:#d64545;--ok:#3a9d6b}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a19;--card:#262523;--ink:#ece8e2;--mut:#9a948b;--line:#383531;--acc:#f08a52;--acc2:#3a2a20;--warn:#ef6a6a;--ok:#5cc08d}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
.shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:17px;padding:4px 10px 14px}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);text-decoration:none}
.ni:hover{background:var(--acc2)}
.ni.on{background:var(--acc2);color:var(--acc);font-weight:600}
.ni b{font-weight:inherit}
.ni em{margin-left:auto;font-style:normal;font-size:12px;background:var(--acc);color:#fff;border-radius:10px;padding:0 7px}
.syncb{margin-top:auto;font-size:12px;color:var(--mut);padding:8px 10px;cursor:pointer;border-radius:9px}
.syncb:hover{background:var(--acc2)}
.syncb.ok{color:var(--ok)}.syncb.err{color:var(--warn)}
main{padding:0 22px 60px;max-width:980px;width:100%;min-width:0}
.cap{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
#capText{width:100%;font-size:16px;padding:11px 14px}
.caprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chk{font-size:13px;color:var(--mut);display:flex;gap:4px;align-items:center;cursor:pointer}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=email],input:not([type]),input[type=date],input[type=datetime-local],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{width:100%;resize:vertical}
button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--warn)}
button.ghost{border:none;background:none;color:var(--mut);padding:2px 6px;font-size:13px}
button.ghost:hover{color:var(--acc)}
h1{font-size:22px;margin:22px 0 4px}
h2{font-size:14px;color:var(--mut);font-weight:600;margin:26px 0 10px;letter-spacing:.04em}
.mut{color:var(--mut)}.sm{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:12px;padding:12px 14px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--c,var(--acc));box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card.dim{opacity:.6}
.ct{font-weight:600;display:flex;align-items:center;gap:6px}
.ct small{margin-left:auto;font-weight:400;color:var(--mut);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.next{margin-top:6px;color:var(--ink)}
.tag{font-size:11px;background:var(--line);border-radius:6px;padding:0 6px;color:var(--mut);font-weight:400}
.chip{font-size:12px;border-radius:10px;padding:0 8px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);text-decoration:none;cursor:pointer;white-space:nowrap}
.addrow{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.addrow .t{flex:1;min-width:160px}
.todo{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line)}
.todo .tt{flex:1;cursor:text}
.todo.done .tt{text-decoration:line-through;color:var(--mut)}
.todo small{color:var(--mut)}
.todo input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.x{border:none;background:none;color:var(--mut);padding:0 6px;font-size:18px;line-height:1}
.x:hover{color:var(--warn)}
.entry{display:flex;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.entry .time{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;flex:none;width:42px;padding-top:1px}
.entry .etext{flex:1;white-space:pre-wrap;word-break:break-word}
.entry.anomaly .etext::before{content:"⚠ ";color:var(--warn)}
.entry.wrap .etext{color:var(--mut)}
.entry.wrap .etext::before{content:"✓ "}
.entry.editing{flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;gap:8px;margin:6px 0}
.entry.editing .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.day{margin:18px 0 4px;font-size:13px;font-weight:600;color:var(--mut)}
.rlist{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid var(--c)}
.rrow:last-child{border-bottom:none}.rrow:hover{background:var(--acc2)}
.rrow b{flex:none;font-size:14px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:14px}
.rrow .rn.none{color:var(--mut)}.rrow small{flex:none;color:var(--mut);font-size:12px}
.resume.mini{padding:8px 12px;cursor:pointer;font-size:14px}
.resume.mini:hover{border-color:var(--c)}
.rline{display:flex;gap:8px;line-height:1.5}.rline b{flex:none;width:16px;text-align:center}
.rline span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfoot{display:flex;align-items:center;gap:8px;margin-top:4px}.rfoot .sm{flex:1}
button.mini{padding:3px 10px;font-size:13px}
.picker{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.picker .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.picker .pq{flex:1;min-width:120px}
.pgroup{margin:10px 0 2px}
.pitem{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.pitem .pk{flex:none;font-size:12px;color:var(--mut);width:82px}
.pitem .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem button{padding:2px 9px;font-size:12px;flex:none}
.pickbtn{margin:2px 0 6px;font-size:13px}
.entry .ghost.tiny{font-size:12px;padding:2px 4px;opacity:.55}.entry:hover .ghost.tiny{opacity:1}
.entry.donet .etext::before{content:"✅ "}
.entry.donet .etext{color:var(--ink)}
.tnotes{white-space:pre-wrap;font-size:13px;color:var(--mut);background:var(--bg);border-radius:8px;padding:6px 10px;margin-top:4px}
details summary{cursor:pointer;font-size:12px;color:var(--mut)}
.resume{background:var(--acc2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:14px 16px;margin:14px 0}
.resume .rh{font-weight:700;margin-bottom:8px}
.resume .rh small{font-weight:400;color:var(--mut);margin-left:6px}
.resume label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.resume .btns{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.phead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}
.phead .nm{font-size:22px;font-weight:700;flex:1;min-width:180px;border-color:transparent;background:transparent}
.phead .nm:focus{background:var(--card);border-color:var(--acc)}
.back{color:var(--mut);cursor:pointer;font-size:13px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--mut);margin:14px 0}
.empty button{margin:6px 6px 0 0}
.cnt{font-size:13px;color:var(--mut);margin-left:8px;font-weight:400}
.cnt.over{color:var(--warn);font-weight:600}
.sugg{display:flex;gap:8px;align-items:center;padding:6px 0;flex-wrap:wrap}
.banner{background:var(--acc2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px;display:flex;gap:10px;align-items:center;font-size:13px}
.gantt{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.glabels{flex:none;width:130px;border-right:1px solid var(--line)}
.glabels.none{display:none}
.ghead{height:28px;border-bottom:1px solid var(--line);position:relative}
.glabel,.grow{height:58px;border-bottom:1px solid var(--line)}
.bar.plan{top:6px;height:22px;background:color-mix(in srgb,var(--c) 18%,var(--card));border:1.5px dashed var(--c);color:var(--ink)}
.bar.act{top:31px;height:21px;background:var(--c);color:#fff}
.bar.act.open{background:repeating-linear-gradient(-45deg,var(--c) 0 8px,color-mix(in srgb,var(--c) 75%,#fff) 8px 16px)}
.act-empty{position:absolute;top:31px;height:21px;border-radius:7px;border:1px dashed var(--line);color:var(--mut);font-size:11px;display:flex;align-items:center;padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden}
.act-empty:hover{border-color:var(--acc);color:var(--acc)}
.olabel{position:absolute;font-size:11.5px;color:var(--mut);white-space:nowrap;pointer-events:none}.olabel.late{color:var(--warn);font-weight:600}
.glegend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin:0 0 8px}
.glegend span{display:flex;align-items:center;gap:5px}
.lg{display:inline-block;width:22px;height:10px;border-radius:3px}
.lg.plan{border:1.5px dashed var(--acc);background:var(--acc2)}.lg.act{background:var(--acc)}
.lg.open{background:repeating-linear-gradient(-45deg,var(--acc) 0 4px,color-mix(in srgb,var(--acc) 70%,#fff) 4px 8px)}
.tdetail{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:10px 12px 12px 34px;display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.tdetail .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tdetail .ttl{font-weight:600}
.todo.open{background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding-left:8px}
.todo .tt{cursor:pointer}.todo .tt:hover{color:var(--acc)}
.note-i{font-size:12px}
.mseditor .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mseditor .lbl{width:34px;font-size:13px;color:var(--mut)}
.glabel{padding:0 10px;display:flex;align-items:center;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gscroll{overflow-x:auto;flex:1;min-width:0}
.gin{position:relative}
.grow{position:relative}
.tick{position:absolute;top:5px;font-size:11px;color:var(--mut);padding-left:3px;border-left:1px solid var(--line);height:18px;white-space:nowrap}
.bar{position:absolute;top:6px;height:24px;border-radius:7px;color:#fff;font-size:12px;display:flex;align-items:center;padding:0 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;white-space:nowrap}
.bar.sel{outline:2px solid var(--ink)}
.bar .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize}
.bar .h.l{left:0}.bar .h.r{right:0}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);opacity:.55;pointer-events:none}
.mseditor{display:flex;flex-direction:column;gap:8px;margin:10px 0;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.mseditor input[type=text]{flex:1;min-width:140px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.sec h3{margin:0 0 8px;font-size:15px}
.sec p{margin:6px 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.on{opacity:.95}
@media(max-width:760px){
 .shell{grid-template-columns:1fr}
 nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--line);background:var(--bg);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;justify-content:space-around}
 .brand,.syncb{display:none}
 .ni{flex-direction:column;gap:0;padding:4px 6px;font-size:11px;position:relative;align-items:center}
 .ni em{position:absolute;top:0;right:0;margin:0;font-size:10px;padding:0 5px}
 main{padding:0 14px 90px}
 .cap{padding-top:calc(10px + env(safe-area-inset-top))}
 .glabels{width:90px}
}
</style>
</head>
<body>
<div class="shell">
  <nav id="nav"></nav>
  <main>
    <div class="cap">
      <input id="capText" placeholder="想到什么，直接写，回车记下来…" autocomplete="off" data-enter="cap-log">
      <div class="caprow">
        <select id="capProj"></select>
        <label class="chk"><input type="checkbox" id="capAnom"> ⚠ 异常</label>
        <button class="pri" data-act="cap-log">记录</button>
        <button data-act="cap-todo">→ 明天待办</button>
        <button data-act="cap-idea">💡 停车场</button>
      </div>
    </div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ 基础工具 ============ */
const KEY='workbuddy.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayS=()=>ymd(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n))};
const dnum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const dstr=n=>{const d=new Date(n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const nowISO=()=>{const d=new Date();return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const WD=['日','一','二','三','四','五','六'];
const fmtDay=s=>{const [y,m,d]=s.split('-').map(Number);return `${m}月${d}日 周${WD[new Date(y,m-1,d).getDay()]}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAL=['#e8763a','#3a8fd6','#3a9d6b','#9b59b6','#d6a93a','#d64585','#2aa5a5'];
const COLLS=['directions','projects','entries','todos','ideas','milestones','protocols','runs'];
const rel=iso=>{if(!iso)return '—';const d=dnum(todayS())-dnum(iso.slice(0,10));return d<=0?'今天':d===1?'昨天':d+'天前'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

/* ============ 数据 ============ */
function fresh(){return {v:1,directions:[],projects:[],entries:[],todos:[],ideas:[],milestones:[],protocols:[],runs:[],meta:{created:nowISO(),lastBackup:''}}}
function normalize(d){const f=fresh();for(const c of COLLS)if(Array.isArray(d[c]))f[c]=d[c];f.meta=Object.assign(f.meta,d.meta||{});
  f.projects.forEach(p=>{p.resume=Object.assign({where:'',next:'',open:'',updatedAt:''},p.resume||{})});return f}
let db;
try{db=normalize(JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch(e){db=fresh()}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('本地保存失败，请马上导出备份')}}
function save(){saveLocal();schedulePush()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const ui={view:'today',pid:null,editing:null,sel:null,gs:null,capFor:null,refocus:false};
const proj=id=>db.projects.find(p=>p.id===id);
const dirColor=id=>{const i=db.directions.findIndex(d=>d.id===id);return i<0?'#9a948b':PAL[i%PAL.length]};
const projColor=p=>p?dirColor(p.directionId):'#9a948b';
const byTime=(a,b)=>b.time.localeCompare(a.time);
function lastAct(p){let t=p.createdAt||'';for(const e of db.entries)if(e.projectId===p.id&&e.time>t)t=e.time;if(p.resume.updatedAt>t)t=p.resume.updatedAt;return t}
const chip=pid=>{const p=proj(pid);return p?`<a class="chip" data-act="open-proj" data-id="${p.id}" style="--c:${projColor(p)}">${esc(p.name)}</a>`:''};
const projOptions=(sel,empty)=>`<option value="">${empty}</option>`+db.projects.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');

/* ============ 视图 ============ */
const NAV=[['today','☀️','今天'],['tomorrow','🌙','明天'],['projects','📁','项目'],['timeline','📅','时间线'],['ideas','💡','停车场'],['done','✅','已完成'],['settings','⚙️','设置']];
function renderNav(){
  const inbox=db.entries.filter(e=>!e.projectId).length;
  $('#nav').innerHTML=`<div class="brand">工作搭子</div>`+NAV.map(([k,ic,l])=>{
    const on=ui.view===k||(k==='projects'&&ui.view==='project');
    const b=k==='today'?inbox:k==='ideas'?db.ideas.length:0;
    return `<a class="ni ${on?'on':''}" data-act="nav" data-id="${k}"><span>${ic}</span><b>${l}</b>${b?`<em>${b}</em>`:''}</a>`}).join('')
    +`<div class="syncb ${SYNC.state}" data-act="nav" data-id="settings">☁ ${esc(SYNC.msg)}</div>`;
}
function refreshCap(){
  const sel=$('#capProj');const cur=sel.value;
  sel.innerHTML=projOptions('','未归类（先放收件箱）');
  const key=ui.view==='project'?ui.pid:'-';
  if(key!==ui.capFor){sel.value=key==='-'?'':key;ui.capFor=key}else sel.value=cur;
}
function renderBanner(){
  const n=db.entries.length+db.todos.length+db.projects.length;const b=$('#banner');
  const last=db.meta.lastBackup||db.meta.created;
  const days=dnum(todayS())-dnum(last.slice(0,10));
  if(n>0&&days>=7&&SYNC.state!=='ok')b.innerHTML=`<div class="banner">🛟 已经 ${days} 天没有备份了。<button data-act="export">导出备份</button></div>`;else b.innerHTML='';
}
function render(){
  const y=window.scrollY;
  renderNav();refreshCap();renderBanner();
  const V={today:vToday,tomorrow:vTomorrow,projects:vProjects,project:vProject,timeline:vTimeline,ideas:vIdeas,done:vDone,settings:vSettings};
  $('#view').innerHTML=V[ui.view]();
  initGantt();
  scrollTo(0,y);
  if(ui.refocus){const i=document.querySelector('#view .addrow .t');if(i)i.focus();ui.refocus=false}
}
function softRender(){const a=document.activeElement;if(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){setTimeout(softRender,1500);return}render()}

const addRow=(date,pid,ph,withDate)=>`<div class="addrow" data-date="${date||''}" data-pid="${pid||''}"><input class="t" data-enter="add-todo" placeholder="${ph}">${pid?'':`<select class="pp" title="属于哪个项目">${projOptions(ui.lastPP||'','不属于项目')}</select>`}${withDate?'<input type="date" class="d" title="可选日期">':''}<button data-act="add-todo">添加</button></div>`;
const todoRow=t=>{
  const open=ui.todoOpen===t.id;
  let h=`<div class="todo ${t.done?'done':''} ${open?'open':''}"><input type="checkbox" data-act="todo-toggle" data-id="${t.id}" ${t.done?'checked':''}><span class="tt" data-act="todo-open" data-id="${t.id}">${esc(t.text)}${t.notes?' <span class="note-i" title="有详细记录">📝</span>':''}</span>${ui.view==='project'?'':chip(t.projectId)}${t.date&&ui.view==='project'?`<small>${t.date.slice(5)}</small>`:''}<button class="x" data-act="todo-del" data-id="${t.id}" title="删除">×</button></div>`;
  if(open)h+=`<div class="tdetail">
    <input type="text" class="ttl" data-chg="todo" data-k="text" data-id="${t.id}" value="${esc(t.text)}">
    <div class="row"><label class="sm mut">日期 <input type="date" data-chg="todo" data-k="date" data-id="${t.id}" value="${t.date||''}"></label><label class="sm mut">项目 <select data-chg="todo" data-k="projectId" data-id="${t.id}">${projOptions(t.projectId,'不属于项目')}</select></label></div>
    <textarea rows="6" data-chg="todo" data-k="notes" data-id="${t.id}" placeholder="具体要做什么、做到哪一步、相关链接、遇到的问题……随便写，自动保存">${esc(t.notes||'')}</textarea>
    <div class="row"><button data-act="todo-stamp" data-id="${t.id}">＋ 插入时间</button><button data-act="todo-close">收起</button><span style="flex:1"></span><button class="danger" data-act="todo-del" data-id="${t.id}">删除这条待办</button></div></div>`;
  return h};
function entryHTML(e,showProj){
  if(ui.editing===e.id)return `<div class="entry editing"><div class="row"><input type="datetime-local" id="ed-time" value="${esc(e.time)}"><select id="ed-proj">${projOptions(e.projectId,'未归类')}</select>${e.kind!=='wrap'?`<label class="chk"><input type="checkbox" id="ed-anom" ${e.kind==='anomaly'?'checked':''}> ⚠ 异常</label>`:''}</div><textarea id="ed-text" rows="3">${esc(e.text)}</textarea><div class="row"><button class="pri" data-act="entry-save" data-id="${e.id}">保存</button><button data-act="entry-cancel">取消</button><button class="danger" data-act="entry-del" data-id="${e.id}">删除</button></div></div>`;
  return `<div class="entry ${e.kind||'log'}"><span class="time">${e.time.slice(11)}</span><div class="etext">${esc(e.text)} ${showProj?chip(e.projectId):''}</div><button class="ghost tiny" data-act="entry-todo" data-d="0" data-id="${e.id}" title="变成今天的待办">+今天</button><button class="ghost tiny" data-act="entry-todo" data-d="1" data-id="${e.id}" title="变成明天的待办">+明天</button><button class="ghost" data-act="entry-edit" data-id="${e.id}">编辑</button></div>`;
}
function doneHTML(t,showProj){
  return `<div class="entry donet"><span class="time">${t.doneAt?t.doneAt.slice(11):''}</span><div class="etext">完成：${esc(t.text)} ${showProj?chip(t.projectId):''}${t.notes?`<details><summary>📝 详细记录</summary><div class="tnotes">${esc(t.notes)}</div></details>`:''}</div><button class="ghost" data-act="todo-toggle" data-id="${t.id}" title="改回没完成">撤销</button></div>`;
}
function picker(date){
  const lbl=date===todayS()?'今天':'明天';
  if(!ui.pickOpen)return `<button class="ghost pickbtn" data-act="pick-toggle">🔍 从项目 / 记录里挑一条加到${lbl}</button>`;
  const q=(ui.pickQ||'').trim().toLowerCase(),pf=ui.pickProj||'';
  const m=x=>!q||x.toLowerCase().includes(q);
  const row=(k,t,attr,b)=>`<div class="pitem"><span class="pk">${k}</span><span class="pt" title="${esc(t)}">${esc(t)}</span><button ${attr} data-date="${date}">${b}</button></div>`;
  let body='';
  for(const p of db.projects.filter(p=>p.status!=='完成'&&(!pf||p.id===pf))){
    let it='';
    if(p.resume.next&&m(p.resume.next)&&!db.todos.some(x=>x.projectId===p.id&&x.text===p.resume.next&&!x.done&&x.date===date))it+=row('▶ 下一步',p.resume.next,`data-act="pick-add" data-src="next" data-id="${p.id}"`,'＋ 加入');
    db.todos.filter(x=>x.projectId===p.id&&!x.done&&x.date!==date&&m(x.text)).forEach(x=>{it+=row('待办 · '+(x.date?x.date.slice(5).replace('-','/'):'无日期'),x.text,`data-act="pick-move" data-id="${x.id}"`,'→ 挪过来')});
    db.entries.filter(e=>e.projectId===p.id&&e.kind!=='wrap'&&m(e.text)).sort(byTime).slice(0,q?30:4).forEach(e=>{it+=row((e.kind==='anomaly'?'⚠ ':'')+'记录 · '+e.time.slice(5,10).replace('-','/'),e.text,`data-act="pick-add" data-src="entry" data-id="${e.id}"`,'＋ 加入')});
    if(it)body+=`<div class="pgroup">${chip(p.id)}</div>${it}`;
  }
  if(!pf){let it='';
    db.todos.filter(x=>!proj(x.projectId)&&!x.done&&x.date!==date&&m(x.text)).forEach(x=>{it+=row('待办 · '+(x.date?x.date.slice(5).replace('-','/'):'无日期'),x.text,`data-act="pick-move" data-id="${x.id}"`,'→ 挪过来')});
    db.entries.filter(e=>!e.projectId&&m(e.text)).sort(byTime).slice(0,q?30:4).forEach(e=>{it+=row('收件箱 · '+e.time.slice(5,10).replace('-','/'),e.text,`data-act="pick-add" data-src="entry" data-id="${e.id}"`,'＋ 加入')});
    if(it)body+=`<div class="pgroup mut sm">不属于项目</div>${it}`;}
  return `<div class="picker"><div class="row"><select data-chg="pickProj">${projOptions(pf,'全部项目')}</select><input type="text" class="pq" data-inp="pickQ" value="${esc(ui.pickQ||'')}" placeholder="搜索关键词…"><button data-act="pick-toggle">收起</button></div>${body||'<div class="mut sm" style="padding:6px 0">没有找到可以加的内容</div>'}</div>`;
}
const resumeCard=p=>`<div class="rrow" data-act="open-proj" data-id="${p.id}" style="--c:${projColor(p)}" title="${esc(p.resume.where?'上次：'+p.resume.where:'')}"><i class="dot"></i><b>${esc(p.name)}</b><span class="rn ${p.resume.next?'':'none'}">${p.resume.next?'▶ '+esc(p.resume.next):'还没写下一步'}</span><small>${rel(lastAct(p))}</small></div>`;
const projCard=p=>`<div class="card click ${p.status!=='进行中'?'dim':''}" data-act="open-proj" data-id="${p.id}" style="--c:${projColor(p)}"><div class="ct"><i class="dot"></i>${esc(p.name)}${p.status!=='进行中'?`<span class="tag">${p.status}</span>`:''}<small>${rel(lastAct(p))}</small></div>${p.resume.next?`<div class="next">▶ ${esc(p.resume.next)}</div>`:''}</div>`;

function vToday(){
  const t=todayS();
  const todos=db.todos.filter(x=>x.date===t);
  const over=db.todos.filter(x=>x.date&&x.date<t&&!x.done);
  const inbox=db.entries.filter(e=>!e.projectId).sort(byTime);
  const te=db.entries.filter(e=>e.projectId&&e.time.slice(0,10)===t).sort(byTime);
  const act=db.projects.filter(p=>p.status==='进行中').sort((a,b)=>lastAct(b).localeCompare(lastAct(a))).slice(0,6);
  let h=`<h1>${fmtDay(t)}</h1>`;
  if(!db.projects.length&&!db.entries.length)h+=`<div class="empty">第一次用？上面的框随时可以直接记东西，先放进收件箱，之后再归类。<br>想先看看效果：<button data-act="seed">载入示例数据</button> 或者去 <button data-act="nav" data-id="projects">建第一个项目</button></div>`;
  if(demoIds().size)h+=`<div class="banner">👀 现在显示的包含示例数据。看完了？<button data-act="demo-clear">清除示例数据</button></div>`;
  if(act.length)h+=`<h2>从哪里接着做</h2><div class="rlist">${act.map(resumeCard).join('')}</div>`;
  h+=`<h2>今天的待办</h2>${todos.map(todoRow).join('')||'<div class="mut sm">今天还没有待办</div>'}${addRow(t,'','加一条今天要做的…')}${picker(t)}`;
  if(over.length)h+=`<h2>过期还没做 · ${over.length}</h2>${over.map(todoRow).join('')}<button data-act="roll-today">全部挪到今天</button>`;
  if(te.length)h+=`<h2>今天的记录</h2>${te.map(e=>entryHTML(e,true)).join('')}`;
  if(inbox.length)h+=`<h2>收件箱 · ${inbox.length} 条还没归类</h2>${inbox.slice(0,50).map(e=>ui.editing===e.id?entryHTML(e,false):`<div class="entry ${e.kind}"><span class="time">${e.time.slice(5,10).replace('-','/')}</span><div class="etext">${esc(e.text)}</div><select data-chg="assign" data-id="${e.id}">${projOptions('','归到…')}</select><button class="ghost" data-act="entry-edit" data-id="${e.id}">编辑</button><button class="x" data-act="entry-del" data-id="${e.id}" title="删除">×</button></div>`).join('')}`;
  return h;
}
function vTomorrow(){
  const t=todayS(),tm=addDays(t,1);
  const list=db.todos.filter(x=>x.date===tm);
  const roll=db.todos.filter(x=>x.date&&x.date<=t&&!x.done).length;
  const sug=db.projects.filter(p=>p.status==='进行中'&&p.resume.next&&!db.todos.some(x=>x.projectId===p.id&&x.text===p.resume.next&&!x.done)).slice(0,6);
  return `<h1>明天 · ${fmtDay(tm)}<span class="cnt ${list.length>3?'over':''}">${list.length} / 3</span></h1>
  <div class="mut sm">${list.length>3?'超过 3 件了，砍掉一两件，明天会轻松很多。':'最多 3 件，写少一点，完成的概率更高。'}</div>
  ${list.map(todoRow).join('')}${addRow(tm,'','明天要做的…')}${picker(tm)}
  ${roll?`<p><button data-act="roll">把今天没做完的 ${roll} 件挪到明天</button></p>`:''}
  ${sug.length?`<h2>各项目写好的“下一步”，要不要加进来</h2>${sug.map(p=>`<div class="sugg">${chip(p.id)}<span style="flex:1">${esc(p.resume.next)}</span><button data-act="sugg-add" data-id="${p.id}">＋ 明天</button></div>`).join('')}`:''}`;
}
function vProjects(){
  const dirOpts=`<option value="">未分组</option>`+db.directions.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');
  let h=`<h1>项目</h1><div class="addrow" id="newProj"><input class="t" data-enter="proj-add" placeholder="新项目名称，回车创建"><select class="d">${dirOpts}</select><button class="pri" data-act="proj-add">新建项目</button></div>`;
  const groups=[...db.directions.map(d=>({d,ps:db.projects.filter(p=>p.directionId===d.id)})),{d:null,ps:db.projects.filter(p=>!db.directions.some(d=>d.id===p.directionId))}];
  for(const g of groups){
    if(!g.d&&!g.ps.length)continue;
    h+=`<h2 style="color:${g.d?dirColor(g.d.id):'var(--mut)'}">${g.d?esc(g.d.name):'未分组'} <button class="ghost" ${g.d?`data-act="dir-rename" data-id="${g.d.id}"`:'hidden'}>改名</button>${g.d?`<button class="ghost" data-act="dir-del" data-id="${g.d.id}">删除</button>`:''}</h2><div class="grid">${g.ps.map(projCard).join('')||'<div class="mut sm">这个大方向下还没有项目</div>'}</div>`;
  }
  h+=`<h2>大方向</h2><div class="addrow"><input class="t" data-enter="dir-add" placeholder="新建一个大方向（项目的上一层），回车添加"><button data-act="dir-add">添加大方向</button></div>`;
  return h;
}
function vProject(){
  const p=proj(ui.pid);if(!p){ui.view='projects';return vProjects()}
  const es=db.entries.filter(e=>e.projectId===p.id).sort(byTime);
  const last=es.find(e=>e.kind!=='wrap');
  const todos=db.todos.filter(x=>x.projectId===p.id);
  const open=todos.filter(x=>!x.done).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
  const done=todos.filter(x=>x.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')).slice(0,3);
  const ms=db.milestones.filter(m=>m.projectId===p.id).sort((a,b)=>a.start.localeCompare(b.start));
  const ideas=db.ideas.filter(i=>i.projectId===p.id);
  const items=[...es.map(e=>({time:e.time,e})),...todos.filter(x=>x.done).map(x=>({time:x.doneAt||((x.date||'0000-00-00')+'T23:59'),t:x}))].sort(byTime);
  let log='',ld='';
  for(const it of items){const d=it.time.slice(0,10);if(d!==ld){log+=`<div class="day">${d==='0000-00-00'?'日期未知':fmtDay(d)}</div>`;ld=d}log+=it.e?entryHTML(it.e,false):doneHTML(it.t,false)}
  const dirOpts=`<option value="">未分组</option>`+db.directions.map(d=>`<option value="${d.id}" ${d.id===p.directionId?'selected':''}>${esc(d.name)}</option>`).join('');
  const r=p.resume;
  return `<div class="back" data-act="nav" data-id="projects">← 所有项目</div>
  <div class="phead"><input class="nm" data-chg="pf" data-k="name" data-id="${p.id}" value="${esc(p.name)}">
   <select data-chg="pf" data-k="directionId" data-id="${p.id}">${dirOpts}</select>
   <select data-chg="pf" data-k="status" data-id="${p.id}">${['进行中','暂停','完成'].map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select>
   <button class="ghost danger" data-act="proj-del" data-id="${p.id}">删除项目</button></div>
  ${ui.resumeOpen===p.id?`<div class="resume" style="--c:${projColor(p)}">
   <div class="rh">📍 接续卡片<small>更新于 ${rel(r.updatedAt)}</small></div>
   <label>上次做到哪</label><textarea rows="2" data-chg="resume" data-k="where" data-id="${p.id}" placeholder="一两句话就够">${esc(r.where)}</textarea>
   <label>▶ 下一步（只写一件事，小到能立刻动手）</label><textarea rows="2" data-chg="resume" data-k="next" data-id="${p.id}">${esc(r.next)}</textarea>
   <label>还没解决的问题</label><textarea rows="2" data-chg="resume" data-k="open" data-id="${p.id}">${esc(r.open)}</textarea>
   <div class="btns"><button class="pri" data-act="wrapup" data-id="${p.id}">收工 ✓ 记下“下次从这里开始”</button><button data-act="resume-close">收起</button>${last?`<span class="mut sm">最近一条记录（${rel(last.time)}）：${esc(last.text.slice(0,60))}</span>`:''}</div>
  </div>`:`<div class="resume mini" style="--c:${projColor(p)}" data-act="resume-open" data-id="${p.id}">
   <div class="rline"><b>📍</b><span class="${r.where?'':'mut'}">${r.where?esc(r.where):'还没写上次做到哪'}</span></div>
   <div class="rline"><b>▶</b><span class="${r.next?'':'mut'}">${r.next?esc(r.next):'还没写下一步'}</span></div>
   ${r.open?`<div class="rline mut"><b>?</b><span>${esc(r.open)}</span></div>`:''}
   <div class="rfoot"><span class="mut sm">点一下展开编辑 · 更新于 ${rel(r.updatedAt)}</span><button class="pri mini" data-act="wrapup" data-id="${p.id}">收工 ✓</button></div>
  </div>`}
  <h2>这个项目的待办</h2>
  ${open.map(todoRow).join('')||'<div class="mut sm">没有待办</div>'}${done.map(todoRow).join('')}${todos.filter(x=>x.done).length>3?`<div class="mut sm" style="padding:4px">更早完成的都在下面的记录里</div>`:''}
  ${addRow('',p.id,'加一条待办…',true)}
  <h2>时间线 · 里程碑</h2>
  ${gantt(ms,{labels:false})}${msEditor()}
  <div class="addrow" data-pid="${p.id}"><input class="t" data-enter="ms-add" placeholder="里程碑名称，如：完成初稿"><input type="date" class="d s" value="${todayS()}"><input type="date" class="d e" value="${addDays(todayS(),7)}"><button data-act="ms-add">添加</button></div>
  ${ideas.length?`<h2>相关的想法</h2>${ideas.map(i=>`<div class="todo"><span class="tt">💡 ${esc(i.text)}</span><button class="x" data-act="idea-del" data-id="${i.id}">×</button></div>`).join('')}`:''}
  <h2>记录 · 全部时间线</h2>${log||'<div class="mut sm">还没有记录。上面的框直接写，会自动记到这个项目里。</div>'}`;
}
function vTimeline(){
  const order=db.projects.map(p=>p.id);
  const ms=db.milestones.filter(m=>proj(m.projectId)).sort((a,b)=>order.indexOf(a.projectId)-order.indexOf(b.projectId)||a.start.localeCompare(b.start));
  return `<h1>时间线</h1><div class="mut sm">每行上面的虚线条是预期，下面的实色条是实际。拖动色条改日期，拖两端改长度；点一下可以填实际日期、改名称或删除。橙色竖线是今天。</div>
  <div style="margin-top:12px">${gantt(ms,{labels:true})}</div>${msEditor()}
  ${db.projects.length?`<div class="addrow"><input class="t" data-enter="ms-add" placeholder="新里程碑名称"><select class="p">${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input type="date" class="d s" value="${todayS()}"><input type="date" class="d e" value="${addDays(todayS(),7)}"><button data-act="ms-add">添加</button></div>`:'<div class="empty">先建一个项目，才能给它加里程碑。</div>'}`;
}
function vDone(){
  const pf=ui.doneProj||'';
  const list=db.todos.filter(x=>x.done&&(!pf||(pf==='_none'?!proj(x.projectId):x.projectId===pf)))
    .sort((a,b)=>(b.doneAt||(b.date||'')+'T23:59').localeCompare(a.doneAt||(a.date||'')+'T23:59'));
  let h=`<h1>已完成</h1><div class="mut sm">所有勾掉的待办都在这里，按完成时间排。属于项目的也会出现在那个项目的记录里。</div>
  <div class="addrow"><select data-chg="doneProj"><option value="">全部（${db.todos.filter(x=>x.done).length}）</option><option value="_none" ${pf==='_none'?'selected':''}>不属于项目</option>${db.projects.map(p=>`<option value="${p.id}" ${p.id===pf?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`;
  let ld='';
  for(const t of list){const d=(t.doneAt||t.date||'').slice(0,10);if(d!==ld){h+=`<div class="day">${d?fmtDay(d):'日期未知'}</div>`;ld=d}h+=doneHTML(t,true)}
  return h+(list.length?'':'<div class="empty">还没有完成的待办。勾掉一条试试 ✓</div>');
}
function vIdeas(){
  const list=[...db.ideas].sort((a,b)=>b.time.localeCompare(a.time));
  return `<h1>想法停车场</h1><div class="mut sm">发散出来、但现在不做的想法放这里：不丢，也不打扰当前项目。</div>
  <div class="addrow"><input class="t" data-enter="idea-add" placeholder="新想法，回车停好"><button data-act="idea-add">停进来</button></div>
  ${list.map(i=>`<div class="todo"><span class="tt">💡 ${esc(i.text)} <small>${rel(i.time)}</small></span><select data-chg="ideaProj" data-id="${i.id}">${projOptions(i.projectId,'关联项目…')}</select><button class="ghost" data-act="idea-todo" data-id="${i.id}">→ 明天待办</button><button class="x" data-act="idea-del" data-id="${i.id}">×</button></div>`).join('')||'<div class="empty">还没有想法。</div>'}`;
}
function vSettings(){
  const s=SYNC;let sync='';
  if(!s.fb&&!s.autoCfg&&s.state!=='err'){
    sync=`<p class="mut sm">在 Firebase 控制台里新建项目并添加一个网页应用，把它给的 firebaseConfig 整段粘贴到这里。（部署到 Firebase Hosting 后会自动读取，不用粘贴。）</p><textarea id="fbcfg" rows="6" placeholder="const firebaseConfig = { apiKey: ..., authDomain: ..., projectId: ... }"></textarea><p><button class="pri" data-act="fbcfg-save">保存并启用</button></p>`;
  }else if(!s.fb){sync=`<p class="mut sm">${esc(s.msg)}</p>${localStorage.getItem(KEY+'.fbcfg')?'<button data-act="fbcfg-clear">清除已保存的配置</button>':''}`}
  else if(!s.user){
    sync=`<p class="mut sm">登录后，所有设备的数据自动保持一致，手机和电脑都能用。第一次请先“注册”。</p><div class="addrow"><input id="au-mail" type="email" class="t" placeholder="邮箱" autocomplete="username"><input id="au-pw" type="password" class="t" placeholder="密码（至少 6 位）" autocomplete="current-password"></div><button class="pri" data-act="auth-login">登录</button> <button data-act="auth-signup">注册</button>`;
  }else{
    sync=`<p>已登录：<b>${esc(s.user.email)}</b></p><p class="mut sm" id="syncMsg">状态：${esc(s.msg)}</p><button data-act="sync-now">立即同步</button> <button data-act="auth-logout">退出登录</button>`;
  }
  const n=c=>db[c].length;

/* ============ 甘特图 ============ */
const DW=26;let ganttFirst=null;
function gantt(ms,o){
  if(!ms.length)return `<div class="empty">还没有里程碑。在下面添加一个，然后可以拖动调整。</div>`;
  const t=dnum(todayS());let lo=t-7,hi=t+90;
  ms.forEach(m=>{lo=Math.min(lo,dnum(m.start)-3,m.aStart?dnum(m.aStart)-3:lo);hi=Math.max(hi,dnum(m.end)+14,m.aEnd?dnum(m.aEnd)+14:hi)});
  const n=hi-lo+1;let head='';
  for(let i=0;i<n;i++){const d=new Date((lo+i)*864e5);if(i===0||d.getUTCDate()===1||d.getUTCDay()===1)head+=`<div class="tick" style="left:${i*DW}px">${d.getUTCMonth()+1}/${d.getUTCDate()}</div>`}
  const labels=ms.map(m=>`<div class="glabel">${esc((proj(m.projectId)||{}).name||'')}</div>`).join('');
  const fits=(txt,w)=>txt.length*12.5+22<=w;
  const outer=(txt,x,top,cls)=>`<div class="olabel ${cls||''}" style="left:${x+5}px;top:${top}px">${txt}</div>`;
  const rows=ms.map(m=>{const c=projColor(proj(m.projectId));const s=dnum(m.start),e=dnum(m.end),sel=ui.sel===m.id?'sel':'';
    const pw=(e-s+1)*DW,px=(s-lo)*DW,ti=esc(m.title);
    let h=`<div class="bar plan ${sel}" data-id="${m.id}" data-kind="plan" style="--c:${c};left:${px}px;width:${pw}px"><i class="h l" data-mode="l"></i><span>${fits(m.title,pw)?ti:''}</span><i class="h r" data-mode="r"></i></div>`;
    if(!fits(m.title,pw))h+=outer(ti,px+pw,9);
    if(m.aStart){const as=dnum(m.aStart),ae=m.aEnd?dnum(m.aEnd):Math.max(t,as);const st=msStatus(m);const aw=(ae-as+1)*DW,ax=(as-lo)*DW;
      h+=`<div class="bar act ${m.aEnd?'':'open'} ${sel}" data-id="${m.id}" data-kind="act" style="--c:${c};left:${ax}px;width:${aw}px"><i class="h l" data-mode="l"></i><span>${fits(st.txt,aw)?st.txt:''}</span><i class="h r" data-mode="r"></i></div>`;
      if(!fits(st.txt,aw))h+=outer(st.txt,ax+aw,34,st.late?'late':'');
      else if(st.late)h+=outer(st.short,ax+aw,34,'late');
    }else h+=`<div class="act-empty" data-act="ms-sel" data-id="${m.id}" style="left:${px}px;width:${Math.max(pw,170)}px">还没开始 · 点这里记录实际</div>`;
    return `<div class="grow">${h}</div>`}).join('');
  ms.earliest=Math.min(...ms.map(m=>Math.min(dnum(m.start),m.aStart?dnum(m.aStart):1e9)));
  ganttFirst=ms.earliest;
  return `<div class="glegend"><span><i class="lg plan"></i>预期</span><span><i class="lg act"></i>实际</span><span><i class="lg open"></i>进行中</span></div><div class="gantt"><div class="glabels ${o.labels?'':'none'}"><div class="ghead"></div>${labels}</div><div class="gscroll" data-lo="${lo}"><div class="gin" style="width:${n*DW}px"><div class="ghead">${head}</div>${rows}<div class="today-line" style="left:${(t-lo)*DW+DW/2}px"></div></div></div></div>`;
}
function msStatus(m){
  if(!m.aStart)return {txt:'',short:'',late:false};
  const pe=dnum(m.end),t=dnum(todayS());
  if(m.aEnd){const d=dnum(m.aEnd)-pe;return {txt:d>0?`完成 · 晚 ${d} 天`:d<0?`完成 · 提前 ${-d} 天`:'完成 · 按时',short:`+${d}天`,late:d>0}}
  const d=t-pe;return {txt:d>0?`进行中 · 已超 ${d} 天`:`进行中 · 还剩 ${-d} 天`,short:`超${d}天`,late:d>0};
}
function msEditor(){
  const m=db.milestones.find(x=>x.id===ui.sel);if(!m)return '';
  const st=msStatus(m);
  return `<div class="mseditor"><div class="row"><input type="text" data-chg="ms" data-k="title" data-id="${m.id}" value="${esc(m.title)}"><button class="danger" data-act="ms-del" data-id="${m.id}">删除</button><button data-act="ms-close">关闭</button></div>
   <div class="row"><b class="lbl">预期</b><input type="date" data-chg="ms" data-k="start" data-id="${m.id}" value="${m.start}"><span>→</span><input type="date" data-chg="ms" data-k="end" data-id="${m.id}" value="${m.end}"></div>
   <div class="row"><b class="lbl">实际</b><input type="date" data-chg="ms" data-k="aStart" data-id="${m.id}" value="${m.aStart||''}"><span>→</span><input type="date" data-chg="ms" data-k="aEnd" data-id="${m.id}" value="${m.aEnd||''}">
    ${m.aStart?'':`<button data-act="ms-start" data-id="${m.id}">今天开始</button>`}${m.aEnd?'':`<button class="pri" data-act="ms-done" data-id="${m.id}">今天完成 ✓</button>`}${m.aStart?`<button class="ghost" data-act="ms-aclear" data-id="${m.id}">清除实际</button>`:''}
    ${st.txt?`<span class="mut sm">${st.txt}</span>`:''}</div></div>`;
}
function initGantt(){
  document.querySelectorAll('.gscroll').forEach(sc=>{
    const lo=+sc.dataset.lo;
    if(ui.gs!=null)sc.scrollLeft=ui.gs;else{const vis=sc.clientWidth/DW,t=dnum(todayS());const first=Math.max(ganttFirst??t,t-Math.floor(vis*0.45));sc.scrollLeft=Math.max(0,(Math.min(first,t-3)-lo-2)*DW);ui.gs=sc.scrollLeft}
    sc.addEventListener('scroll',()=>{ui.gs=sc.scrollLeft});
    sc.querySelectorAll('.bar').forEach(bar=>{
      bar.addEventListener('pointerdown',ev=>{
        const m=db.milestones.find(x=>x.id===bar.dataset.id);if(!m)return;
        const mode=ev.target.dataset.mode||'move',isAct=bar.dataset.kind==='act';
        const x0=ev.clientX;let s0,e0;
        if(isAct){s0=dnum(m.aStart);e0=m.aEnd?dnum(m.aEnd):Math.max(dnum(todayS()),s0)}else{s0=dnum(m.start);e0=dnum(m.end)}
        let moved=false,ns=null,ne=null;
        try{bar.setPointerCapture(ev.pointerId)}catch(e){}
        const mv=e=>{
          if(Math.abs(e.clientX-x0)>3)moved=true;if(!moved)return;
          const d=Math.round((e.clientX-x0)/DW);let s=s0,en=e0;
          if(mode==='move'){s+=d;en+=d}else if(mode==='l')s=Math.min(s0+d,e0);else en=Math.max(e0+d,s0);
          ns=s;ne=en;bar.style.left=(s-lo)*DW+'px';bar.style.width=(en-s+1)*DW+'px';
        };
        const up=()=>{
          bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up);
          if(moved&&ns!=null){
            if(isAct){m.aStart=dstr(ns);if(m.aEnd||mode==='r')m.aEnd=dstr(ne)}else{m.start=dstr(ns);m.end=dstr(ne)}
            save()}
          ui.sel=m.id;render();
        };
        bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up);
      });
    });
  });
}

    if(!el.value)return;m[k]=el.value;if(m.end<m.start){if(k==='start')m.end=m.start;else m.start=m.end}save();laterRender()}
};
const authErr=e=>({'auth/invalid-credential':'邮箱或密码不对','auth/invalid-email':'邮箱格式不对','auth/weak-password':'密码太短（至少 6 位）','auth/email-already-in-use':'这个邮箱已经注册过了，直接登录','auth/operation-not-allowed':'还没在 Firebase 里开启邮箱登录','auth/network-request-failed':'网络不通','auth/too-many-requests':'试太多次了，稍后再试'}[e.code]||('出错：'+(e.code||e.message)));

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const f=ACTIONS[el.dataset.act];if(f)f(el,ev)});
/* 日期框：等输入完、离开输入框时才保存，避免年份只打了两位就被存成 0020 年 */
const badYear=v=>v&&(+v.slice(0,4)<1900||+v.slice(0,4)>2200);
let ptrDown=false,needRender=false;
document.addEventListener('pointerdown',()=>{ptrDown=true},true);
const ptrEnd=()=>{ptrDown=false;if(needRender){needRender=false;setTimeout(render,0)}};
document.addEventListener('pointerup',ptrEnd,true);document.addEventListener('pointercancel',ptrEnd,true);
function laterRender(){if(ui.silent)return;if(ptrDown)needRender=true;else setTimeout(render,0)}
function commitDate(el){ui.silent=true;try{const f=CHG[el.dataset.chg];if(f)f(el)}finally{ui.silent=false}}
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-chg]');if(!el)return;
  if(el.type==='date'&&(document.activeElement===el||badYear(el.value))){el.dataset.pending='1';if(!badYear(el.value)){commitDate(el);ui.dateDirty=true}return}
  const f=CHG[el.dataset.chg];if(f)f(el)});
document.addEventListener('focusout',ev=>{const el=ev.target;if(el.type!=='date')return;
  const toDate=ev.relatedTarget&&ev.relatedTarget.type==='date';
  if(el.dataset.pending){delete el.dataset.pending;if(badYear(el.value))toast('年份不对，请输入完整的四位年份，比如 2026');else{commitDate(el);ui.dateDirty=true}}
  if(ui.dateDirty&&!toDate){ui.dateDirty=false;laterRender()}});
function pickSearch(el){ui.pickQ=el.value;clearTimeout(ui.pt);ui.pt=setTimeout(()=>{render();const i=document.querySelector('.pq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},300)}
document.addEventListener('compositionend',ev=>{if(ev.target.dataset&&ev.target.dataset.inp==='pickQ')pickSearch(ev.target)});
function flushTodo(){const ta=document.querySelector('.tdetail textarea');if(ta)CHG.todo(ta)}
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset&&el.dataset.inp==='pickQ'){if(!ev.isComposing)pickSearch(el);return}if(el.dataset&&el.dataset.chg==='todo'&&el.dataset.k==='notes'){clearTimeout(ui.nt);ui.nt=setTimeout(()=>CHG.todo(el),600)}});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'||ev.shiftKey||ev.isComposing||ev.keyCode===229)return;
  if(ev.target.type==='date'){ev.target.blur();return}
  const a=ev.target.dataset&&ev.target.dataset.enter;if(a&&ACTIONS[a]){ev.preventDefault();ACTIONS[a](ev.target)}
});
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.projects)||!Array.isArray(d.entries))throw 0;if(!confirm('导入会替换现在的全部数据，确定吗？（建议先导出当前数据备份）'))return;db=normalize(d);save();render();toast('导入完成')}catch(x){toast('文件格式不对')}};
  r.readAsText(f);e.target.value=''});

/* ============ 示例数据 ============ */
function seed(){
  const before=new Set(COLLS.flatMap(c=>db[c].map(it=>it.id)));
  const t=todayS();const dA={id:uid(),name:'主线课题'},dB={id:uid(),name:'探索方向'};db.directions.push(dA,dB);
  const mk=(name,d,next,where,open)=>({id:uid(),name,directionId:d.id,status:'进行中',createdAt:addDays(t,-20)+'T09:00',resume:{where,next,open,updatedAt:addDays(t,-2)+'T18:00'}});
  const p1=mk('示例：样品表征',dA,'把第三批样品的数据导出并画图','做完了第二批的测量，数据还没整理','第三批峰位偏移，不确定是仪器还是样品');
  const p2=mk('示例：写方法部分',dA,'补上参数表','写到了 2.3 节','参考文献格式还没统一');
  const p3=mk('示例：新方法调研',dB,'列出 3 个候选方法','','');
  db.projects.push(p1,p2,p3);
  const at=(dd,hm,text,pid,kind)=>db.entries.push({id:uid(),text,time:addDays(t,dd)+'T'+hm,projectId:pid,kind:kind||'log'});
  at(-3,'10:20','第二批样品开始测量',p1.id);at(-3,'15:40','第二个样品的峰位和上一批对不上',p1.id,'anomaly');
  at(-2,'17:50','收工｜下次从这里开始：把第三批样品的数据导出并画图',p1.id,'wrap');at(-1,'11:05','写完 2.2 节',p2.id);
  at(0,'09:30','突然想到可以试试另一种归一化方式',null);
  db.todos.push({id:uid(),text:'整理第二批数据',date:t,projectId:p1.id,done:false,notes:'先导出原始数据 → 去背景 → 和第一批放在一张图里对比\n注意：第 2 个样品的峰位有偏移，单独标出来'},{id:uid(),text:'回复合作者邮件',date:t,projectId:null,done:true,doneAt:t+'T10:15'},{id:uid(),text:'补参数表',date:addDays(t,1),projectId:p2.id,done:false});
  db.milestones.push({id:uid(),projectId:p1.id,title:'样品准备',start:addDays(t,-14),end:addDays(t,-8),aStart:addDays(t,-13),aEnd:addDays(t,-5)},{id:uid(),projectId:p1.id,title:'三批数据完成',start:addDays(t,-5),end:addDays(t,6),aStart:addDays(t,-4),aEnd:''},{id:uid(),projectId:p2.id,title:'方法部分初稿',start:addDays(t,-1),end:addDays(t,9),aStart:addDays(t,-1),aEnd:''},{id:uid(),projectId:p3.id,title:'调研',start:addDays(t,3),end:addDays(t,14)});
  db.ideas.push({id:uid(),text:'能不能把测量流程做成向导，一步一步点',time:addDays(t,-1)+'T22:10',projectId:null});
  for(const c of COLLS)db[c].forEach(it=>{if(!before.has(it.id))it.demo=true});
}
/* 识别示例数据：新版带 demo 标记；旧版按名称/内容识别 */
const DEMO_TXT=new Set(['第二批样品开始测量','第二个样品的峰位和上一批对不上','收工｜下次从这里开始：把第三批样品的数据导出并画图','写完 2.2 节','突然想到可以试试另一种归一化方式','整理第二批数据','回复合作者邮件','补参数表','能不能把测量流程做成向导，一步一步点']);
function demoIds(){
  const pids=new Set(db.projects.filter(p=>p.demo||/^示例：/.test(p.name)).map(p=>p.id));
  const isD=it=>it.demo||pids.has(it.projectId)||DEMO_TXT.has(it.text);
  const ids=new Set(pids);
  for(const c of ['entries','todos','ideas','milestones'])db[c].forEach(it=>{if(isD(it))ids.add(it.id)});
  db.directions.forEach(d=>{if(d.demo||(['主线课题','探索方向'].includes(d.name)&&!db.projects.some(p=>p.directionId===d.id&&!pids.has(p.id))))ids.add(d.id)});
  return ids;
}
function removeDemo(){const ids=demoIds();let n=0;for(const c of COLLS){const k=db[c].length;db[c]=db[c].filter(it=>!ids.has(it.id));n+=k-db[c].length}return n}

/* ============ Firebase 云同步（可选） ============ */
const SYNC={state:'off',msg:'本地模式',fb:null,user:null,last:{},timer:null,unsub:null,ready:false,autoCfg:false};
function setSync(state,msg){SYNC.state=state;SYNC.msg=msg;renderNav();const m=$('#syncMsg');if(m)m.textContent='状态：'+msg}
function parseCfg(str){try{const a=str.indexOf('{'),b=str.lastIndexOf('}');if(a<0||b<a)return null;
  let s=str.slice(a,b+1).replace(/\/\/.*$/gm,'').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');return JSON.parse(s)}catch(e){return null}}
const itemMap=()=>{const m={};for(const c of COLLS)for(const it of db[c])m[c+'__'+it.id]=JSON.stringify(it);return m};
async function syncInit(){
  let cfg=null;
  if(location.protocol.startsWith('http')){try{const r=await fetch('/__/firebase/init.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.apiKey){cfg=j;SYNC.autoCfg=true}}}catch(e){}}
  if(!cfg){try{cfg=JSON.parse(localStorage.getItem(KEY+'.fbcfg')||'null')}catch(e){}}
  if(!cfg){setSync('off','本地模式');return}
  setSync('busy','连接中…');
  try{
    const B='https://www.gstatic.com/firebasejs/11.0.2/';
    const [A,F,Au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
    const app=A.initializeApp(cfg);let fs;
    try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){fs=F.getFirestore(app)}
    const auth=Au.getAuth(app);SYNC.fb={A,F,Au,app,fs,auth};
    Au.onAuthStateChanged(auth,u=>{SYNC.user=u;if(u)startSync();else{stopSync();setSync('off','未登录');if(ui.view==='settings')softRender()}});
  }catch(e){SYNC.fb=null;setSync('err','云同步加载失败（网络？）');}
}
function stopSync(){if(SYNC.unsub){SYNC.unsub();SYNC.unsub=null}SYNC.ready=false;SYNC.last={}}
function startSync(){
  const {F,fs}=SYNC.fb;stopSync();setSync('busy','同步中…');
  const col=F.collection(fs,'users',SYNC.user.uid,'items');
  SYNC.unsub=F.onSnapshot(col,snap=>{
    let changed=false;
    snap.docChanges().forEach(ch=>{
      if(ch.doc.metadata.hasPendingWrites)return;
      const k=ch.doc.id,i=k.indexOf('__'),c=k.slice(0,i),id=k.slice(i+2);if(!COLLS.includes(c))return;
      if(ch.type==='removed'){const n=db[c].length;db[c]=db[c].filter(x=>x.id!==id);delete SYNC.last[k];if(db[c].length!==n)changed=true}
      else{const j=ch.doc.data().j;SYNC.last[k]=j;const it=JSON.parse(j),ix=db[c].findIndex(x=>x.id===id);
        if(ix<0){db[c].push(it);changed=true}else if(JSON.stringify(db[c][ix])!==j){db[c][ix]=it;changed=true}}
    });
    SYNC.ready=true;
    if(changed){saveLocal();softRender()}
    schedulePush();
    setSync('ok',snap.metadata.fromCache?'离线（本地缓存）':'已同步');
    if(ui.view==='settings'&&!changed)softRender();
  },err=>setSync('err','同步出错：'+(err.code||err.message)));
}
function schedulePush(){if(!SYNC.fb||!SYNC.user||!SYNC.ready)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushNow,700)}
function pushNow(){
  const {F,fs}=SYNC.fb;const cur=itemMap(),ops=[];
  for(const k in cur)if(SYNC.last[k]!==cur[k])ops.push(['set',k,cur[k]]);
  for(const k in SYNC.last)if(!(k in cur))ops.push(['del',k]);
  if(!ops.length)return;
  setSync('busy','同步中…');
  for(let i=0;i<ops.length;i+=400){
    const b=F.writeBatch(fs);
    ops.slice(i,i+400).forEach(o=>{const ref=F.doc(fs,'users',SYNC.user.uid,'items',o[1]);if(o[0]==='set')b.set(ref,{c:o[1].split('__')[0],j:o[2],t:Date.now()});else b.delete(ref)});
    b.commit().then(()=>setSync('ok','已同步')).catch(e=>setSync('err','上传失败：'+(e.code||e.message)));
  }
  ops.forEach(o=>{if(o[0]==='set')SYNC.last[o[1]]=o[2];else delete SYNC.last[o[1]]});
}

/* ============ 启动 ============ */
render();
syncInit();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&location.hostname!=='localhost'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
